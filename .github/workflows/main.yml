name: Build ToquiQTT Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: COMPILACIÓN PARA ANDROID (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      - run: flutter pub run flutter_launcher_icons

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/artifacts/
          mv build/app/outputs/flutter-apk/app-release.apk build/artifacts/ToquiQTT-v1.0.0-b${{ github.run_number }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/artifacts/ToquiQTT-v1.0.0-b${{ github.run_number }}.apk

  # ==========================================
  # JOB 2: COMPILACIÓN PARA WINDOWS (.EXE)
  # ==========================================
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\artifacts
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\artifacts\ToquiQTT-Windows-v1.0.0-b${{ github.run_number }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build\artifacts\ToquiQTT-Windows-v1.0.0-b${{ github.run_number }}.zip

  # ==========================================
  # JOB 3: PUBLICACIÓN UNIFICADA EN RELEASES
  # ==========================================
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Create working directory
        run: mkdir -p release-artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-artifacts

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/*"
          tag: v1.0.0-${{ github.run_number }}
          name: Release v1.0.0 (Build ${{ github.run_number }})
          body: "Nueva versión automatizada multiplataforma de ToquiQTT (Android y Windows)."
          token: ${{ secrets.GITHUB_TOKEN }}